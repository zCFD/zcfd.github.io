  <text class="zc-fill-ink" x="46" y="222" style="fill: #262624">faceBC</text>
  <text class="zc-fill-ink" x="304" y="222" text-anchor="end" style="fill: #262624">faces × 1</text>
  <rect class="zc-stroke-grid" x="36" y="234" width="278" height="22" style="fill: none; stroke: #d9d9d6; stroke-width: 1"/>
  <text class="zc-fill-ink" x="46" y="250" style="fill: #262624">faceInfo</text>
