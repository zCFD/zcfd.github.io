  <text class="zc-fill-ink" x="540" y="232" font-size="11" text-anchor="middle" style="fill: #262624">face 2</text>
  <text class="zc-fill-ink" x="360" y="270" font-size="12" style="fill: #262624">each entry is a row of nodeVertex,</text>
