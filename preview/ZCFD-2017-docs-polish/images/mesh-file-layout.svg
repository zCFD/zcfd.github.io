<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600pt" height="330pt" viewBox="0 0 600 330" version="1.1" font-family="Lato, Manrope, sans-serif" font-size="13">
 <g id="mesh-file-layout-file">
  <rect class="zc-stroke-ink" x="10" y="10" width="330" height="310" rx="6" style="fill: none; stroke: #262624; stroke-width: 1.2"/>
  <text class="zc-fill-ink" x="22" y="30" style="fill: #262624">HDF5 file</text>
  <rect class="zc-stroke-ink" x="24" y="42" width="302" height="266" rx="4" style="fill: none; stroke: #262624; stroke-width: 1"/>
  <text class="zc-fill-ink" x="36" y="62" style="fill: #262624">group mesh</text>
  <text class="zc-fill-ink" x="36" y="82" font-size="12" style="fill: #262624">attributes numCells, numFaces</text>
 </g>
 <g id="mesh-file-layout-datasets">
